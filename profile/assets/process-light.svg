<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" role="img" aria-label="How we work: 1 Tell us, 2 See a demo, 3 Go live, 4 We keep it running.">
  <line x1="62" y1="40" x2="918" y2="40" stroke="rgba(13,17,16,0.16)" stroke-width="1.5" stroke-dasharray="3 6"/>
  <circle cx="40" cy="40" r="22" fill="#ffffff" stroke="#c99a45" stroke-width="1.5"/>
  <text x="40" y="46.5" text-anchor="middle" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#c99a45">1</text>
  <text x="18" y="104" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="-0.3" fill="#0d1110">Tell us</text>
  <text font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#5a625e">
    <tspan x="18" y="138">A short form about your</tspan>
    <tspan x="18" y="164">business. Two minutes.</tspan>
  </text>
  <circle cx="340" cy="40" r="22" fill="#ffffff" stroke="#c99a45" stroke-width="1.5"/>
  <text x="340" y="46.5" text-anchor="middle" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#c99a45">2</text>
  <text x="318" y="104" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="-0.3" fill="#0d1110">See a demo</text>
  <text font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#5a625e">
    <tspan x="318" y="138">A first version of your</tspan>
    <tspan x="318" y="164">site, built to be seen.</tspan>
  </text>
  <circle cx="640" cy="40" r="22" fill="#ffffff" stroke="#c99a45" stroke-width="1.5"/>
  <text x="640" y="46.5" text-anchor="middle" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#c99a45">3</text>
  <text x="618" y="104" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="-0.3" fill="#0d1110">Go live</text>
  <text font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#5a625e">
    <tspan x="618" y="138">Polished with you, then</tspan>
    <tspan x="618" y="164">published on your domain.</tspan>
  </text>
  <circle cx="940" cy="40" r="22" fill="#ffffff" stroke="#c99a45" stroke-width="1.5"/>
  <text x="940" y="46.5" text-anchor="middle" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#c99a45">4</text>
  <text x="918" y="104" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="-0.3" fill="#0d1110">We keep it running</text>
  <text font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#5a625e">
    <tspan x="918" y="138">Hosting, updates and</tspan>
    <tspan x="918" y="164">small changes, for you.</tspan>
  </text>
